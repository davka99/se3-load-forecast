# Re-runs the data download and analysis pipeline and commits the outputs.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Space-separated stages: fetch reconcile quality explore select baselines regression gbm evaluate"
        required: true
        default: "quality explore select baselines regression gbm evaluate"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - name: Pipeline
        env:
          STAGES: ${{ inputs.stages }}
        run: python scripts/run_pipeline.py $(echo "$STAGES" | tr -cd 'a-z_ ')
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data reports docs
          git diff --cached --quiet && exit 0
          git commit -m "Update pipeline output"
          git push
